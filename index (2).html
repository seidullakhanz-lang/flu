<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Бауырсақ ойыны</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #fff3b0, #ffcc70);
    text-align: center;
    padding: 20px;
}

h1 {
    color: #ff6f00;
}

#game {
    background: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 0 15px gray;
    max-width: 600px;
    margin: auto;
}

button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 12px;
    background-color: #ff9800;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #e65100;
    transform: scale(1.1);
}

#baursak {
    font-size: 60px;
    animation: roll 2s infinite linear;
}

@keyframes roll {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

#score, #lives, #timer {
    font-weight: bold;
    margin: 8px;
}
</style>
</head>

<body>

<h1>🥯 Бауырсақ 🥯</h1>

<div id="score">⭐ Ұпай: 0</div>
<div id="lives">❤️ Өмір: 3</div>
<div id="timer">⏳ Уақыт: 40</div>

<div id="game">
    <div id="baursak">🥯</div>
    <p id="story"></p>
    <div id="choices"></div>
</div>

<script>
let score = 0;
let lives = 3;
let timeLeft = 40;
let step = 0;

const story = document.getElementById("story");
const choices = document.getElementById("choices");

function updateScore(points) {
    score += points;
    document.getElementById("score").innerHTML = "⭐ Ұпай: " + score;
}

function updateLives(change) {
    lives += change;
    document.getElementById("lives").innerHTML = "❤️ Өмір: " + lives;
    if (lives <= 0) {
        endGame("💀 Өмір бітті! Қайта ойнап көр!");
    }
}

function startTimer() {
    const timer = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerHTML = "⏳ Уақыт: " + timeLeft;
        if (timeLeft <= 0) {
            clearInterval(timer);
            endGame("⏰ Уақыт бітті!");
        }
    }, 1000);
}

function nextStep(choice) {

    if (step === 0) {
        story.innerHTML = "Бауырсақ орманға шықты. Алдынан Қоян шықты 🐰";
        choices.innerHTML = `
            <button onclick="nextStep(1)">Ән айтып қашу 🎵</button>
            <button onclick="nextStep(2)">Тұрып қалу 😨</button>
        `;
        step++;
    }

    else if (step === 1) {
        if (choice === 1) {
            updateScore(10);
            story.innerHTML = "Жарайсың! Бауырсақ қояннан қашып кетті!";
        } else {
            updateLives(-1);
            story.innerHTML = "Қоян ұстап ала жаздады! 😬";
        }
        choices.innerHTML = `
            <button onclick="nextStep(3)">Әрі қарай жүру ➡️</button>
        `;
        step++;
    }

    else if (step === 2) {
        story.innerHTML = "Алдынан Қасқыр шықты 🐺";
        choices.innerHTML = `
            <button onclick="nextStep(4)">Ән айту 🎵</button>
            <button onclick="nextStep(5)">Қашу 🏃</button>
        `;
        step++;
    }

    else if (step === 3) {
        if (choice === 4) {
            updateScore(10);
            story.innerHTML = "Қасқыр да алданып қалды!";
        } else {
            updateLives(-1);
            story.innerHTML = "Қасқыр қауіпті болды! 😱";
        }
        choices.innerHTML = `
            <button onclick="finishGame()">Түлкіге кездесу 🦊</button>
        `;
    }
}

function finishGame() {
    story.innerHTML = "🦊 Түлкі айлакер! Бауырсақ сақ болу керек!";
    choices.innerHTML = `
        <button onclick="endGame('🎉 Құттықтаймыз! Сен Бауырсақты құтқардың! Жалпы ұпай: ' + score)">
        Ақылды жауап беру 🧠
        </button>
    `;
}

function endGame(message) {
    story.innerHTML = message;
    choices.innerHTML = `<button onclick="location.reload()">Қайта ойнау 🔄</button>`;
}

nextStep();
startTimer();
</script>

</body>
</html>
